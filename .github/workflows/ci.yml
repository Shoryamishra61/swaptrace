name: SwapTrace CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync Dependencies
        run: uv sync --extra dev

      - name: Run Test Suite (pytest)
        run: uv run pytest --tb=short

      - name: Run End-to-End Benchmark Pipeline
        run: uv run python -m swaptrace.cli demo

      - name: Run Formal Evaluation & Scenario Proofs
        run: uv run python -m swaptrace.cli eval
