[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swaptrace"
version = "1.0.0"
description = "Battery charging-session telemetry anomaly detection and fault attribution for swap networks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Coulomb AI", email = "eng@coulombai.example" }]

dependencies = [
    "polars>=1.9.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "typer>=0.12.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "pyarrow>=17.0.0",
    "rich>=13.9.0",
    "structlog>=24.4.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.2",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
swaptrace = "swaptrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/swaptrace"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
files = ["src/swaptrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_functions = ["test_*"]

